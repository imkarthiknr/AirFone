name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    name: API · lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  api-test-sqlite:
    name: API · tests · SQLite · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest

  api-test-mysql:
    name: API · tests · MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: airfone
          MYSQL_USER: airfone
          MYSQL_PASSWORD: airfone
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql+pymysql://airfone:airfone@127.0.0.1:3306/airfone
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Migrations apply cleanly, match the models, and seed
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.seed --demo
          uv run alembic downgrade base
      - name: Test suite against MySQL
        run: uv run pytest
        env:
          TEST_DATABASE_URL: mysql+pymysql://airfone:airfone@127.0.0.1:3306/airfone

  web:
    name: Web · format, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, API + web)
    runs-on: ubuntu-latest
    needs: [api-test-sqlite, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  docker:
    name: Docker Compose smoke test (MySQL + API + nginx)
    runs-on: ubuntu-latest
    needs: [api-test-mysql, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8080
          home=$(curl --fail -s "$base/")
          grep -q '<app-root>' <<<"$home"
          plans=$(curl --fail -s "$base/api/v1/plans")
          jq -e 'length == 27' <<<"$plans"
          token=$(curl --fail -s -X POST "$base/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d '{"mobile_no":"9000000001","password":"airfone123"}' | jq -r .access_token)
          plan=$(jq '[.[] | select(.category=="prepaid")][0].id' <<<"$plans")
          bill=$(curl --fail -s -X POST "$base/api/v1/me/recharges" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "{\"plan_id\":$plan,\"card\":{\"cardholder_name\":\"CI\",\"number\":\"4242424242424242\",\"exp_month\":12,\"exp_year\":2099,\"cvv\":\"123\"}}")
          jq -e '.payment.card_last4 == "4242"' <<<"$bill"
          admin=$(curl --fail -s -X POST "$base/api/v1/auth/admin/login" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin12345"}' | jq -r .access_token)
          stats=$(curl --fail -s "$base/api/v1/admin/stats" -H "Authorization: Bearer $admin")
          jq -e '.recharges_this_month >= 1' <<<"$stats"
      - name: Data survives an API restart
        run: |
          docker compose restart api
          docker compose up --wait --wait-timeout 120
          curl --fail -s http://localhost:8080/api/v1/plans | jq -e 'length == 27'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
